{% extends 'base.html' %}

{% block title %}Delete Workout | Calisthenics Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h4 class="fw-bold">Delete workout?</h4>
                <p class="text-muted">
                    {{ workout }} and all of its {{ workout.sets.count }} sets will be permanently removed.
                </p>
                <form method="post" class="d-flex justify-content-between">
                    {% csrf_token %}
                    <a href="{% url 'workout_detail' workout.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
