<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Calisthenics Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'dashboard' %}">
                <i class="bi bi-lightning-charge-fill"></i> Calisthenics Tracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">

                    <!-- Dashboard Tab -->
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active fw-bold text-white border-bottom border-primary border-2{% endif %}"
                           href="{% url 'dashboard' %}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>

                    <!-- Exercises Tab -->
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'exercise_list' %}active fw-bold text-white border-bottom border-primary border-2{% endif %}"
                           href="{% url 'exercise_list' %}">
                            <i class="bi bi-journal-bookmark"></i> Exercises
                        </a>
                    </li>

                    <!-- Workouts Tab -->
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'workout_list' or request.resolver_match.url_name == 'workout_create' %}active fw-bold text-white border-bottom border-primary border-2{% endif %}"
                           href="{% url 'workout_list' %}">
                            <i class="bi bi-stopwatch"></i> Workouts
                        </a>
                    </li>

                    <!-- Workout Sets Tab -->
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'workout_set_list' %}active fw-bold text-white border-bottom border-primary border-2{% endif %}"
                           href="{% url 'workout_set_list' %}">
                            <i class="bi bi-layers"></i> Workout Sets
                        </a>
                    </li>

                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="{% url 'workout_create' %}" class="btn btn-primary btn-sm rounded-pill">
                        <i class="bi bi-plus-lg"></i> New Workout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
